spring:
  application:
    name: event-processor
  profiles:
    active: default
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:event_processor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: event-processor-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
    producer:
      acks: all
      properties:
        enable.idempotence: true
kafka:
  retry:
    max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
    initial-interval: ${KAFKA_RETRY_INITIAL_INTERVAL:1000ms}
    multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
    max-interval: ${KAFKA_RETRY_MAX_INTERVAL:10000ms}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.eventprocessor: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

idempotency:
  processing-lease-duration: ${IDEMPOTENCY_LEASE_DURATION:60s}
